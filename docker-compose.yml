# ── AuditForge — orchestration complète (VPS auto-hébergé) ──────────────────
# Usage :
#   1. cp .env.example .env   puis renseignez AUTH_SECRET / ENGINE_INTERNAL_TOKEN
#      (+ TOOL_EXECUTION_MODE=real et LLM_API_KEY pour l'exécution réelle)
#   2. docker compose up -d --build
#   3. Interface : http://<votre-domaine-ou-ip>/  (HTTPS automatique si SITE_DOMAIN est défini)
#
# Architecture réseau : seul Caddy est exposé (80/443). `app`, `engine`,
# `docker-proxy` et `llm-bridge` vivent sur le réseau interne Docker — aucun
# n'est publié sur l'hôte.
#
# P1 (audit plateforme v2) : ce compose est ALIGNÉ sur docker-compose.prod.yml —
# le moteur ne monte plus /var/run/docker.sock en brut : toutes les opérations
# Docker des sandboxes passent par le proxy filtrant `docker-proxy` (P0.3),
# avec healthcheck (P1) : le moteur ne démarre que si le proxy répond.
#
# P2 (audit plateforme v2) — confinement & robustesse opérationnelle :
#   - healthcheck du MOTEUR (Dockerfile.engine) ; caddy n'attend plus un simple
#     « démarré » mais un moteur effectivement sain (service_healthy) ;
#   - limites de ressources par conteneur (mem_limit/cpus/pids_limit) — un
#     dérèglement (sandbox, fuite mémoire, fork bomb) ne peut plus affamer le
#     VPS ; les sandboxes tournent côté démon HÔTE (hors plafond du moteur) ;
#   - rotation des logs json-file (10 Mo × 3) — /var/lib/docker ne croît plus
#     sans borne (le moteur est verbeux pendant les scans) ;
#   - confinement : no-new-privileges partout, cap_drop ALL (sauf
#     NET_BIND_SERVICE pour caddy 80/443) ;
#   - segmentation réseau : `edge` (exposition), `data` (app ⇄ moteur,
#     interne), `docker-ctrl` (moteur ⇄ proxy Docker, interne) — fin du réseau
#     plat par défaut où tout joignait tout.

name: auditforge

# Rotation des logs — commune à tous les services (ancre YAML).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Application Next.js : frontend + API REST ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      # connection_limit=1 : un seul écrivain par process (SQLite multi-process)
      # socket_timeout=30 : tolère les stalls fsync sous charge (P1008 18:34)
      DATABASE_URL: file:/data/auditforge.db?connection_limit=1&socket_timeout=30
      AUTH_SECRET: ${AUTH_SECRET:?Renseignez AUTH_SECRET dans le fichier .env (openssl rand -hex 32)}
      ENGINE_INTERNAL_TOKEN: ${ENGINE_INTERNAL_TOKEN:?Renseignez ENGINE_INTERNAL_TOKEN dans le fichier .env (openssl rand -hex 32)}
      ENGINE_URL: http://engine:3030
      # ── Comptes au premier démarrage (C2) ──
      # Par défaut (production) : AUCUN compte de démonstration. Définissez le
      # premier administrateur dans le .env, ou forcez DEMO_SEED=1 (démo only).
      DEMO_SEED: ${DEMO_SEED:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - auditforge-data:/data
    restart: unless-stopped
    # ── P2 : confinement & ressources ──
    logging: *default-logging
    security_opt:
      - no-new-privileges:true # aucun binaire setuid ne peut prendre des privilèges
    cap_drop: [ALL] # serveur Node non privilégié : aucune capability requise
    mem_limit: ${APP_MEM_LIMIT:-512m}
    cpus: "${APP_CPUS:-1.0}"
    pids_limit: 512
    networks: [edge, data]
    # Aucun `ports:` : l'application n'est joignable que via le reverse proxy.

  # ── Moteur d'exécution des scans (socket.io + /internal/* + outils réels) ──
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      NODE_ENV: production
      # connection_limit=1 + socket_timeout=30 : idem app (écritures concurrentes
      # app ⇄ moteur sur le même fichier SQLite partagé, WAL).
      DATABASE_URL: file:/data/auditforge.db?connection_limit=1&socket_timeout=30
      AUTH_SECRET: ${AUTH_SECRET:?Renseignez AUTH_SECRET dans le fichier .env (openssl rand -hex 32)}
      ENGINE_INTERNAL_TOKEN: ${ENGINE_INTERNAL_TOKEN:?Renseignez ENGINE_INTERNAL_TOKEN dans le fichier .env (openssl rand -hex 32)}
      BIND_HOST: 0.0.0.0
      # ── Limites de ressources ──
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-3}
      # P4 : capacité de la file d'attente moteur (au-delà du plafond simultané)
      MAX_QUEUED_SCANS: ${MAX_QUEUED_SCANS:-100}
      # Rétention des journaux de scan (P3) — 0 désactive
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      # CORS socket.io : URL publique du site (si définie dans le .env)
      SITE_ORIGIN: ${SITE_ORIGIN:-}
      # ── Exécution réelle des outils ──
      # simulation : aucune cible touchée | auto : réel si disponible | real : réel strict
      TOOL_EXECUTION_MODE: ${TOOL_EXECUTION_MODE:-auto}
      # LLM des outils réels — endpoint OpenAI-compatible :
      #   Z.ai direct : https://api.z.ai/api/paas/v4  (clé dans LLM_API_KEY)
      #   pont local  : http://llm-bridge:3031/v1
      LLM_API_BASE: ${LLM_API_BASE:-https://api.z.ai/api/paas/v4}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PHANTOM_LLM: ${PHANTOM_LLM:-openai/glm-4.6}
      # Compresseur mémoire de phantom (symétrique prod — sans cette ligne,
      # le défaut amont « DeepSeek-V3.2 » sans préfixe provider déclenche
      # « LLM Provider NOT provided » à chaque compression de contexte).
      PHANTOM_COMPRESSOR_LLM: ${PHANTOM_COMPRESSOR_LLM:-}
      BASALT_MODEL: ${BASALT_MODEL:-glm-4.6}
      # Sandbox Kali enrichie (outils supplémentaires — voir Dockerfile.sandbox).
      # Vide = image amont ghcr.io/usta0x001/phantom-sandbox:latest.
      PHANTOM_IMAGE: ${PHANTOM_IMAGE:-}
      REAL_SCAN_TIMEOUT_MIN: ${REAL_SCAN_TIMEOUT_MIN:-180}
      # Docker passe par le proxy interne (P0.3, alignement prod P1) —
      # DOCKER_HOST est dans l'allowlist sanitizedEnv (proc.ts) → transmis aux
      # CLI phantom/basalt. NB : phantom._resolve_docker_host() est patché
      # (Dockerfile.engine, correctif n°2bis) pour IGNORER le hostname de
      # DOCKER_HOST et toujours retourner host.docker.internal — c'est LÀ que
      # la sandbox publie son tool-server (ports hôte), pas sur le proxy.
      DOCKER_HOST: ${DOCKER_HOST:-tcp://docker-proxy:2375}
      # ── Plateformes distantes (DeepAudit / RedAmon) ──
      # Déployez chaque plateforme (docker compose de son dépôt — voir README)
      # puis déclarez la connexion ; sans ces variables : simulation honnête.
      # DeepAudit doit être joignable depuis ce conteneur (réseau Docker ou hôte).
      DEEPAUDIT_API_URL: ${DEEPAUDIT_API_URL:-}
      DEEPAUDIT_EMAIL: ${DEEPAUDIT_EMAIL:-}
      DEEPAUDIT_PASSWORD: ${DEEPAUDIT_PASSWORD:-}
      REDAMON_API_URL: ${REDAMON_API_URL:-}
      REDAMON_EMAIL: ${REDAMON_EMAIL:-}
      REDAMON_PASSWORD: ${REDAMON_PASSWORD:-}
    volumes:
      - auditforge-data:/data
      # P1 : plus AUCUN docker.sock monté ici — le moteur passe par le proxy
      # interne `docker-proxy` (voir service ci-dessous), comme en prod.
    restart: unless-stopped
    # P0.4 : alignement prod — SHUTDOWN_GRACE_MS=90s côté moteur + marge.
    stop_grace_period: 150s
    # ── P5 : résolution host.docker.internal (tool-server des sandboxes) ──
    # phantom._resolve_docker_host() (patché, Dockerfile.engine n°2bis) retourne
    # host.docker.internal : la sandbox publie son tool-server sur les ports de
    # l'HÔTE. Sans extra_hosts, le nom ne résout pas depuis le conteneur →
    # ~144 s de healthchecks en échec → exit 1 « JSON final illisible »
    # (incident 2026-10-29 : override.yml manquant sur le VPS).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ── P2 : confinement & ressources ──
    # NB : les sandboxes Phantom/Basalt sont des conteneurs du DÉMON hôte
    # (créés via docker-proxy) — leur empreinte mémoire/CPU n'est PAS plafonnée
    # par les limites ci-dessous (voir README, section ressources).
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL] # écoute 3030 (>1024) + CLI docker via TCP : aucune capability
    mem_limit: ${ENGINE_MEM_LIMIT:-2g}
    cpus: "${ENGINE_CPUS:-2.0}"
    pids_limit: 1024 # CLI docker + sous-processus python des outils réels
    networks: [edge, data, docker-ctrl]
    depends_on:
      app:
        condition: service_healthy # le schéma est appliqué au boot de `app`
      docker-proxy:
        condition: service_healthy # P1 : scans réels impossibles sans proxy
    # Aucun `ports:` : moteur strictement confiné au réseau interne Docker.

  # ── Proxy Docker (P0.3 audit v2, alignement dev P1) ─
  # Le moteur ne parle plus directement au démon Docker de l'hôte : il passe
  # par ce proxy qui ne laisse ouverts que les endpoints nécessaires aux
  # sandboxes (containers/images/networks/volumes/events + POST), et bloque
  # build/exec/secrets/swarm/system (attaque conteneur privilégié → hôte).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      # ── Endpoints autorisés (minimum requis par phantom/basalt) ──
      PING: 1          # /_ping (handshake CLI + healthcheck P1)
      VERSION: 1       # /version (négociation CLI ⇄ démon)
      INFO: 1          # /info (docker info / contexte)
      CONTAINERS: 1    # create/start/attach/wait/archive(cp)/inspect/rm
      IMAGES: 1        # inspect + pull (POST /images/create)
      EVENTS: 1        # boucles d'attente des CLI docker
      NETWORKS: 1      # inspection réseau de la sandbox
      VOLUMES: 1       # volumes éventuels de la sandbox
      POST: 1          # indispensable : create/start/wait/pull
      # ── Tout le reste est REFUSÉ (défaut 0) ──
      BUILD: 0
      COMMIT: 0
      # P5 : docker exec requis par les agents DEEPAUDIT/PHANTOM (chaque outil
      # est exécuté via `docker exec <sandbox>` — incident 2026-10-29 : EXEC:0
      # → 403 « unable to upgrade to tcp » → sandbox non opérationnelle).
      EXEC: 1
      SYSTEM: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      NODES: 0
      PLUGINS: 0
      CONFIGS: 0
      SESSION: 0
      DISTRIBUTION: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    # ── P2 : confinement & ressources ──
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Pas de cap_drop ici : image tierce (haproxy) — durcissement conservateur.
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 256
    networks: [docker-ctrl]
    # P1 : healthcheck /_ping — engine et caddy n'attendent plus un simple
    # « démarré » mais un proxy effectivement joignable.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # Aucun `ports:` : l'API du proxy n'est joignable que sur le réseau interne
    # `docker-ctrl` (tcp://docker-proxy:2375) — UNIQUEMENT depuis le moteur.
    # Ne PAS publier 2375 sur l'hôte.

  # ── Pont LLM v2 — proxy multi-modèles en rotation (round-robin) ───────────
  # Proxy OpenAI-compatible : découvre dynamiquement les modèles réellement
  # disponibles de chaque upstream (sonde 1 token), les met en rotation « à
  # tours de rôle » (aucun quota de modèle ne s'épuise isolément) et applique
  # un failover cooldown exponentiel (402/403/429/5xx → modèle écarté, la
  # requête est rejouée sur le suivant). Re-découverte périodique (15 min).
  # Upstreams via AF_UPSTREAMS (nom|base|clé|role;… — voir .env.example du
  # pont : mini-services/llm-bridge/.env.example).
  #
  # Accès : publication RESTREINTE à la passerelle docker0 (172.17.0.1) —
  # joignable depuis le moteur ET depuis les sandboxes Kali de Phantom/Basalt
  # (bridge par défaut → http://172.17.0.1:3031/v1), JAMAIS depuis Internet
  # (ni 0.0.0.0, ni réseau externe ; auth Bearer LLM_BRIDGE_KEY en sus).
  # Egress Internet : réseau dédié `llm` (le réseau `data` est internal).
  llm-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    environment:
      LLM_BRIDGE_KEY: ${LLM_BRIDGE_KEY:-}
      AF_UPSTREAMS: ${AF_UPSTREAMS:-}
      AF_STATIC_MODELS: ${AF_STATIC_MODELS:-}
      AF_REFRESH_MS: ${AF_REFRESH_MS:-900000}
      AF_ATTEMPTS: ${AF_ATTEMPTS:-5}
      BIND_HOST: 0.0.0.0
    ports:
      # Passerelle docker0 UNIQUEMENT : moteur + sandboxes locaux. Jamais 0.0.0.0.
      - "172.17.0.1:3031:3031"
    restart: unless-stopped
    # ── P2 : confinement & ressources (aligné sur les services actifs) ──
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: ${BRIDGE_MEM_LIMIT:-256m}
    cpus: "0.5"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3031/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [data, llm]
    # data  : joignable du moteur (DNS llm-bridge) ; llm : egress MaaS/router.

  # ── Reverse proxy : unique point d'entrée (80/443) ────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    # ── P2 : confinement & ressources ──
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE # seule capability requise : écoute 80/443
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    cpus: "${CADDY_CPUS:-1.0}"
    pids_limit: 256
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy
      # P2 : le healthcheck du moteur (Dockerfile.engine) est fiable — caddy
      # ne publie 80/443 qu'une fois socket.io + /internal/* réellement servis.
      engine:
        condition: service_healthy

volumes:
  auditforge-data: # base SQLite partagée (app ⇄ moteur, mode WAL)
  caddy-data: # certificats TLS (HTTPS automatique)
  caddy-config:

# ── P2 : segmentation réseau ──────────────────────────────────────────────────
# edge        : exposition — caddy ⇄ app (HTTP) et caddy ⇄ engine (socket.io).
#               Seul réseau avec sortie Internet (route par défaut).
# data        : app ⇄ moteur (API /internal) — `internal: true`, aucun accès
#               externe.
# docker-ctrl : moteur ⇄ docker-proxy — plan de contrôle Docker isolé ; le
#               proxy n'est joignable d'AUCUN autre service.
# llm         : egress Internet pour llm-bridge uniquement (upstreams LLM) —
#               `data` étant internal, le pont a besoin d'une route sortante
#               dédiée ; aucun autre service n'y est attaché.
networks:
  edge:
    driver: bridge
  data:
    internal: true
  docker-ctrl:
    internal: true
  llm:
    driver: bridge # egress Internet (sondes + complétions vers les upstreams LLM)
